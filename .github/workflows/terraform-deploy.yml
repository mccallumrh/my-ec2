name: Terraform EC2 Provisioning

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  terraform:
    name: "Terraform Provision"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0 # Use your preferred version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your preferred region

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Upload Private Key Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-ec2-key
          path: terraform-ec2-key.pem # Matches the key_name and local_file resource in Terraform
          retention-days: 1 # Automatically deletes the key from GitHub after 1 day for security
